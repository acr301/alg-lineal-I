[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aqua-gauss"
# Fuente de verdad de la versión. Criterio: una tarea del curso = un *major*
# (ver docs/VERSIONADO.md). v3 = Tarea 3 (propiedades de R^n, #29).
version = "3.0.0"
description = "Resuelve y analiza sistemas de ecuaciones lineales Ax = b por eliminación de Gauss, paso a paso y sin librerías de álgebra."
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Andrés Castillo"},
    {name = "Fátima Zogaib"},
    {name = "Roberto Macías"},
    {name = "Reynaldo Molina"},
]

# El núcleo de cálculo (aqua_gauss.core) no tiene dependencias: solo Python.
dependencies = []

[project.optional-dependencies]
# Cliente gráfico PyQt6. matplotlib SOLO renderiza la notación matemática
# (LaTeX -> imagen) vía su motor mathtext; el algoritmo no lo usa.
qt = [
    "PyQt6>=6.6,<7",
    "matplotlib>=3.9.4",
]
dev = [
    "aqua-gauss[qt]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
aqua-gauss = "aqua_gauss.app:main"

[project.urls]
Homepage = "https://github.com/acr301/alg-lineal-I"
Repository = "https://github.com/acr301/alg-lineal-I.git"
Issues = "https://github.com/acr301/alg-lineal-I/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aqua_gauss"]

# Lint + formato en una sola herramienta (sustituye a black + isort).
# El workflow que lo ejecuta en CI vive en el issue #27.
[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
# ruff formatea también los bloques ```python de Markdown; los fragmentos de
# docs/ e informes/ son ilustrativos (a veces a propósito no "black"), no código.
extend-exclude = ["docs", "informes", "*.md"]

[tool.ruff.lint]
# E/W  pycodestyle · F  pyflakes (imports/variables sin usar) · I  isort · UP  pyupgrade
select = ["E", "W", "F", "I", "UP"]
# La longitud de línea la impone el formatter; no duplicar el aviso.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Los tests fijan variables de ejemplo que solo sirven para comprobar que la
# llamada no lanza; y hacen imports tardíos tras fijar QT_QPA_PLATFORM.
"tests/**" = ["F841", "E402"]

[tool.ruff.format]
# Equivalente a black con la line-length de arriba.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
pythonpath = ["src"]
