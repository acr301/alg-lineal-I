name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publica ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      AQUA_GAUSS_SILENCIAR: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Librerías de sistema para Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libdbus-1-3 libglib2.0-0

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Guard — el tag debe coincidir con pyproject.version
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          desc="$(git describe --tags --exact-match)"
          echo "tag=$tag  pyproject=v$ver  git-describe=$desc"
          if [ "$tag" != "v$ver" ] || [ "$desc" != "$tag" ]; then
            echo "::error::El tag ($tag) no coincide con la versión de pyproject (v$ver) o con git describe ($desc)."
            exit 1
          fi

      - name: Tests
        run: uv run --extra dev pytest

      - name: Construir artefactos de fuente
        run: uv build

      - name: Extraer la sección del CHANGELOG
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Crear el GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
